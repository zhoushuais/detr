random_seed: 444


dataset:
  type: &dataset_type 'KITTI'
  root_dir: '../data/KITTIDataset'
  train_split: 'train'
  test_split: 'val'
  batch_size: 16
  use_3d_center: True
  class_merging: False
  use_dontcare: False
  bbox2d_type: 'anno'  # 'proj' or 'anno'
  meanshape: False  # use predefined anchor or not
  writelist: ['Car', 'Pedestrian', 'Cyclist']
  clip_2d: False

  aug_pd: True
  aug_crop: True

  random_flip: 0.5
  random_crop: 0.5
  scale: 0.05
  shift: 0.05

  depth_scale: 'normal'


model_name: 'monodetr'
model:
  num_classes: 3
  return_intermediate_dec: True
  device: 'cuda'

  # Backbone
  backbone: 'resnet50'
  train_backbone: True
  num_feature_levels: 4
  dilation: False
  position_embedding: 'sine'  # 'sine' or 'learned'
  masks: False

  # [P1-SCA-FPN] Improvement 1: Spatial-Channel Attention FPN.
  # Inserts high-level semantic guidance for low-level spatial attention
  # between input_proj and the depth_predictor / transformer encoder.
  # Set use_sca_fpn=False to fall back to baseline MonoDETR.
  #
  # Ablation rows (planned for thesis Tab.):
  #   row1: use_sca_fpn=False                                                  -> Baseline
  #   row2: use_sca_fpn=True,  high_guidance=False, dcn=False                  -> +CA/SA only
  #   row3: use_sca_fpn=True,  high_guidance=True,  dcn=False                  -> +top-down guide
  #   row4: use_sca_fpn=True,  high_guidance=True,  dcn=True                   -> Full (P1 final)
  use_sca_fpn: True
  sca_fpn_reduction: 16          # channel attention bottleneck ratio (CBAM style)
  sca_fpn_kernel: 7              # spatial attention conv kernel size
  sca_fpn_high_guidance: True    # top-down high-level SA guidance for low levels
  use_dcn_lateral: True          # 3x3 deformable conv in lateral path (zero-init offsets)
  dcn_kernel: 3                  # DCN kernel size (3 is standard, must be >=3)

  # Depth predictor
  mode: LID
  num_depth_bins: 80
  depth_min: 1e-3
  depth_max: 60.0

  # Transformer
  with_box_refine: True
  two_stage: False
  use_dab: False
  use_dn: False
  two_stage_dino: False
  init_box: False
  enc_layers: 3
  dec_layers: 3
  hidden_dim: 256
  dim_feedforward: 256
  dropout: 0.1
  nheads: 8
  num_queries: 50
  enc_n_points: 4
  dec_n_points: 4
  # DN
  scalar: 5
  label_noise_scale: 0.2
  box_noise_scale: 0.4
  num_patterns: 0
  # Loss
  aux_loss: True

  # Loss coefficients
  cls_loss_coef: 2
  focal_alpha: 0.25

  bbox_loss_coef: 5
  giou_loss_coef: 2
  3dcenter_loss_coef: 10
  dim_loss_coef: 1
  angle_loss_coef: 1
  depth_loss_coef: 1
  depth_map_loss_coef: 1

  # Matcher
  set_cost_class: 2
  set_cost_bbox: 5
  set_cost_giou: 2
  set_cost_3dcenter: 10


optimizer:
  type: 'adamw'
  lr: 0.0002
  weight_decay: 0.0001


lr_scheduler:
  type: 'step'  # 'step' or 'cos'
  warmup: False  # 5 epoches, cosine warmup, init_lir=0.00001 in default
  decay_rate: 0.1
  decay_list: [125, 165]


trainer:
  max_epoch: 195
  gpu_ids: '1'
  save_frequency: 1  # checkpoint save interval (in epoch)
  # resume_model: True
  # pretrain_model: path/to/ckpt
  save_path: 'outputs/'
  save_all: False  # False for only savng the best and latest ckpts
  use_dn: False
  scalar: 5
  label_noise_scale: 0.2
  box_noise_scale: 0.4
  num_patterns: 0

tester:
  type: *dataset_type
  mode: single  # 'single' or 'all'; 'all' to evaluate all ckpts in the folder
  checkpoint: 195  # the start ckpt epoch for 'all'
  threshold: 0.2  # confidence filter
  topk: 50