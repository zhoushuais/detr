random_seed: 444


dataset:
  type: &dataset_type 'KITTI'
  root_dir: '../data/KITTIDataset'
  train_split: 'train'
  test_split: 'val'
  batch_size: 16
  use_3d_center: True
  class_merging: False
  use_dontcare: False
  bbox2d_type: 'anno'  # 'proj' or 'anno'
  meanshape: False  # use predefined anchor or not
  # Best checkpoint selection uses the mean of
  # Car/Pedestrian/Cyclist AP_R40 3D Moderate, so all three classes are required.
  writelist: ['Car', 'Pedestrian', 'Cyclist']
  clip_2d: False

  aug_pd: True
  aug_crop: True

  random_flip: 0.5
  random_crop: 0.5
  scale: 0.05
  shift: 0.05

  depth_scale: 'normal'


model_name: 'monodetr'
model:
  num_classes: 3
  return_intermediate_dec: True
  device: 'cuda'

  # Backbone
  backbone: 'resnet50'
  train_backbone: True
  num_feature_levels: 4
  dilation: False
  position_embedding: 'sine'  # 'sine' or 'learned'
  masks: False

  # [P1-SCA-FPN] Spatial-Channel Attention FPN.
  # Inserts feature enhancement after input_proj and before depth_predictor /
  # depth-aware transformer. For P1+P2 combined training, keep this enabled.
  use_sca_fpn: True
  sca_fpn_reduction: 16
  sca_fpn_kernel: 7
  sca_fpn_high_guidance: True
  use_dcn_lateral: True
  dcn_kernel: 3

  # Depth predictor
  mode: LID
  num_depth_bins: 80
  depth_min: 1e-3
  depth_max: 60.0

  # Transformer
  with_box_refine: True
  two_stage: False
  use_dab: False
  use_dn: False
  two_stage_dino: False
  init_box: False
  enc_layers: 3
  dec_layers: 3
  hidden_dim: 256
  dim_feedforward: 256
  dropout: 0.1
  nheads: 8
  num_queries: 50
  enc_n_points: 4
  dec_n_points: 4
  # DN
  scalar: 5
  label_noise_scale: 0.2
  box_noise_scale: 0.4
  num_patterns: 0
  # Loss
  aux_loss: True

  # [P2-COP] Chain-of-Prediction depth head (MonoCoP, CVPR 2026).
  # Replaces the independent depth_embed MLP with a chained prediction:
  #   hs -> dim_feat -> angle_feat -> depth_out
  # Each step conditions on the previous prediction + original hs.
  #   r0: use_cop=False  -> Baseline (independent MLP)
  #   r1: use_cop=True   -> + Chain-of-Prediction depth head
  # cop_mode: depth_only keeps original dim/angle heads; full also replaces dim/angle features.
  use_cop: True
  cop_mode: 'depth_only'

  # [P3-SADL] Scale-aware depth loss for small / far objects.
  # Reweights only the matched query-level depth loss by normalized 2D box area:
  #   w = 1 + alpha * exp(-area / tau), then normalized by batch mean.
  # This keeps inference unchanged and avoids changing the overall loss scale.
  use_scale_aware_depth_loss: True
  scale_aware_depth_alpha: 1.0
  scale_aware_depth_tau: 0.01
  scale_aware_depth_max: 2.0

  # Loss coefficients
  cls_loss_coef: 2
  focal_alpha: 0.25

  bbox_loss_coef: 5
  giou_loss_coef: 2
  3dcenter_loss_coef: 10
  dim_loss_coef: 1
  angle_loss_coef: 1
  depth_loss_coef: 1
  depth_map_loss_coef: 1

  # Matcher
  set_cost_class: 2
  set_cost_bbox: 5
  set_cost_giou: 2
  set_cost_3dcenter: 10


optimizer:
  type: 'adamw'
  lr: 0.0002
  weight_decay: 0.0001


lr_scheduler:
  type: 'step'  # 'step' or 'cos'
  warmup: False  # 5 epoches, cosine warmup, init_lir=0.00001 in default
  decay_rate: 0.1
  decay_list: [125, 165]


trainer:
  max_epoch: 195
  gpu_ids: '1'
  save_frequency: 1  # checkpoint save interval (in epoch)
  # resume_model: True
  # pretrain_model: path/to/ckpt
  save_path: 'outputs/'
  save_all: False  # False for only savng the best and latest ckpts
  use_dn: False
  scalar: 5
  label_noise_scale: 0.2
  box_noise_scale: 0.4
  num_patterns: 0

tester:
  type: *dataset_type
  mode: single  # 'single' or 'all'; 'all' to evaluate all ckpts in the folder
  checkpoint: 195  # the start ckpt epoch for 'all'
  threshold: 0.2  # confidence filter
  topk: 50


